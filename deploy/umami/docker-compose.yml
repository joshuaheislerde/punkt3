# Umami (cookieless web analytics) as a Portainer stack.
# Set the variables below in the Portainer stack environment, then route a domain
# (e.g. stats.joshuaheisler.de) to UMAMI_PORT via Pangolin.
#   POSTGRES_PASSWORD           random string
#   APP_SECRET                  openssl rand -hex 32
#   TWO_FACTOR_ENCRYPTION_KEY   openssl rand -hex 32 (optional, needed for 2FA)
#   UMAMI_PORT                  host port, defaults to 3556

services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "${UMAMI_PORT:-3556}:3000"
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      # rotate the anonymous visitor hash daily, so visitors can't be recognised across days
      SALT_ROTATION: day
      DISABLE_TELEMETRY: 1
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
